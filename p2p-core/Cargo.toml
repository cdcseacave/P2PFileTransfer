[package]
name = "p2p-core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Core P2P file transfer library"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"  # MessagePack serialization
zstd = "0.13"
crc32fast = "1.4"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
bitvec = { version = "1.0", features = ["serde"] }
bytes = "1.7"
futures = "0.3"
tracing = "0.1.41"
serde_json = "1.0.145"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.12"

[package.metadata]
# Re-export uuid for use in integration tests
uuid = { version = "1.10", features = ["v4"] }
