name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: p2p-transfer
            asset_name: p2p-transfer-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: p2p-transfer.exe
            asset_name: p2p-transfer-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: p2p-transfer
            asset_name: p2p-transfer-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: p2p-transfer
            asset_name: p2p-transfer-macos-arm64
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}
        override: true
    
    - name: Build release
      run: cargo build --release --target ${{ matrix.target }} --features cli
    
    - name: Strip binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.asset_name }}
        path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
    
  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          **/p2p-transfer*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
